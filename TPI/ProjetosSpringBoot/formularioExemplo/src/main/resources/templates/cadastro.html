<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de cadastro de produto</title>
    <style>
        .formulario { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        .resultado { background: #e7f3fe; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<h2>Cadastrar Produto</h2>

<form th:action="@{/salvar-produto}" method="post">
    <div class="formulario">
        <label>Nome Produto:</label>
        <input type="text" name="nome" required placeholder="Ex: Garrafa" />
    </div>

    <div class="formulario">
        <label>Preço: </label>
        <input type="double" step="0.01" name="preco" required />
    </div>

    <div class="formulario">
        <label>Categoria:</label>
        <select name="categoria">
            <option value="Eletrônicos">Eletrônicos</option>
            <option value="Alimenticios">Alimenticios</option>
            <option value="Vestuário">Vestuário</option>
        </select>
    </div>

    <button type="submit">Cadastrar Produto</button>
</form>

<div th:if="${sucesso}" class="resultado">
    <h3>😊Produtos Cadastrados com Sucesso</h3>
    <p><strong>Nome Produto:</strong> <span th:text="${n}"></span></p>
    <p><strong>Preço Produto:</strong> R$ <span th:text="${p}"></span></p>
    <p><strong>Categoria Produto:</strong> <span th:text="${c}"></span></p>
</div>

</body>
</html>
